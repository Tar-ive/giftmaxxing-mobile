# App Store screenshot capture — run on an iPhone 16 Pro Max simulator
# (6.9", 1320×2868 → APP_IPHONE_69). Drives the signed-in app through the
# curated commerce pilot and saves PNGs to build/appstore-shots/.
# Usage (repo root, Debug build):
#   ~/.maestro/bin/maestro --device <PRO_MAX_UDID> test scripts/appstore-screenshots.yaml
appId: com.giftmaxxing.ios
name: appstore — screenshot capture
tags:
  - screenshots
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
    arguments:
      curatedScreenshotMode: "YES"

- extendedWaitUntil:
    optional: true
    visible: "Skip for now"
    timeout: 12000
- runFlow:
    when:
      visible: "Skip for now"
    commands:
      - tapOn: "Skip for now"

# Home — let the feed images finish loading before the shot.
- extendedWaitUntil:
    visible: "Home"
    timeout: 15000
- extendedWaitUntil:
    optional: true
    visible: "never-matches-just-waiting"
    timeout: 6000
- takeScreenshot: build/appstore-shots/01-home

- tapOn: "Open Make the memory the gift"
- extendedWaitUntil:
    visible: "View source post"
    timeout: 10000
- extendedWaitUntil:
    optional: true
    visible: "never-matches-just-waiting"
    timeout: 2000
- takeScreenshot: build/appstore-shots/02-guide

- swipe:
    start: 50%, 82%
    end: 50%, 24%
    duration: 700
- extendedWaitUntil:
    visible: "Products in the idea"
    timeout: 5000
- extendedWaitUntil:
    optional: true
    visible: "never-matches-just-waiting"
    timeout: 1500
- takeScreenshot: build/appstore-shots/03-products

- swipe:
    start: 50%, 82%
    end: 50%, 20%
    duration: 700
- swipe:
    start: 50%, 82%
    end: 50%, 20%
    duration: 700
- swipe:
    start: 50%, 82%
    end: 50%, 20%
    duration: 700
- swipe:
    start: 50%, 82%
    end: 50%, 20%
    duration: 700
- extendedWaitUntil:
    visible: "Add the wrap kit"
    timeout: 5000
- extendedWaitUntil:
    optional: true
    visible: "never-matches-just-waiting"
    timeout: 1500
- takeScreenshot: build/appstore-shots/04-wrap

- tapOn: "Back"
- extendedWaitUntil:
    visible: "Cart, 5 to buy"
    timeout: 5000
- tapOn: "Cart, 5 to buy"
- extendedWaitUntil:
    visible: "Cart"
    timeout: 5000
- extendedWaitUntil:
    optional: true
    visible: "never-matches-just-waiting"
    timeout: 1500
- takeScreenshot: build/appstore-shots/05-cart
