# GitHub → TestFlight, no human in the loop.
#
# Every push to main that touches the app (plus the Run-workflow button for
# ad-hoc releases) archives a signed Release build and uploads it straight to
# App Store Connect. Internal testers get it the moment Apple finishes
# processing — no laptop, no Xcode Organizer.
#
# How signing works here (the no-fastlane, Apple-blessed path):
#   • An App Store Connect API key (secrets, below) authenticates xcodebuild.
#   • `-allowProvisioningUpdates` + the API key lets xcodebuild use Apple's
#     CLOUD SIGNING: it creates/fetches the Apple Distribution certificate
#     and provisioning profiles for both bundle ids (app + share extension)
#     on the fly — nothing stored in the repo, no .p12 required.
#   • Optionally, a locally-exported .p12 can be supplied via the two cert
#     secrets below; the import step then runs and xcodebuild prefers it.
#   • ExportOptions.plist uses destination=upload, so exporting IS uploading;
#     manageAppVersionAndBuildNumber=true makes Xcode pick the next free
#     build number by asking App Store Connect — CI and manual Xcode uploads
#     can interleave without "build already exists" failures.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID              App Store Connect API key ID (e.g. 2X9R4HXF34)
#   ASC_ISSUER_ID           Issuer ID from the same Integrations page
#   ASC_KEY_P8              Full contents of the AuthKey_<KEYID>.p8 file
# Optional (only if cloud signing is ever unavailable for the team):
#   BUILD_CERTIFICATE_B64   base64 of an Apple Distribution .p12 export
#   P12_PASSWORD            password chosen when exporting that .p12
# See docs/testflight-deployment.md for the step-by-step on creating each.

name: TestFlight

on:
  push:
    branches: [main]
    paths:
      - 'Giftmaxxing/**'
      - 'GiftmaxxingShare/**'
      - 'project.yml'
      - '.github/workflows/ios-testflight.yml'
      - '.github/ExportOptions.plist'
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false # let an in-flight upload finish; queue the next

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      KEYCHAIN_NAME: ci-signing.keychain-db
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Fail fast with a human-readable list instead of a cryptic signing error
      # twenty minutes in. The .p12 pair is optional (cloud signing default).
      - name: Check signing secrets are configured
        id: secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD_CERTIFICATE_B64: ${{ secrets.BUILD_CERTIFICATE_B64 }}
        run: |
          missing=()
          [ -n "$ASC_KEY_ID" ]    || missing+=(ASC_KEY_ID)
          [ -n "$ASC_ISSUER_ID" ] || missing+=(ASC_ISSUER_ID)
          [ -n "$ASC_KEY_P8" ]    || missing+=(ASC_KEY_P8)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} — see docs/testflight-deployment.md"
            exit 1
          fi
          if [ -n "$BUILD_CERTIFICATE_B64" ]; then
            echo "has_cert=true" >> "$GITHUB_OUTPUT"
            echo "Using imported .p12 distribution certificate"
          else
            echo "has_cert=false" >> "$GITHUB_OUTPUT"
            echo "No .p12 provided — relying on Apple cloud signing via the API key"
          fi

      # App Store Connect rejects uploads built with SDKs older than iOS 26,
      # but the image's default Xcode is still 16.4 (iOS 18.5 SDK). Pick the
      # newest installed Xcode dynamically so image updates keep working.
      - name: Select latest Xcode
        run: |
          LATEST=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Canonical Apple/GitHub recipe: throwaway keychain, imported .p12,
      # partition list so xcodebuild can use the key non-interactively.
      # Skipped entirely when no .p12 secret is set (cloud signing path).
      - name: Import distribution certificate
        if: steps.secrets.outputs.has_cert == 'true'
        env:
          BUILD_CERTIFICATE_B64: ${{ secrets.BUILD_CERTIFICATE_B64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN_PATH="$RUNNER_TEMP/$KEYCHAIN_NAME"
          CERT_PATH="$RUNNER_TEMP/distribution.p12"

          echo -n "$BUILD_CERTIFICATE_B64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

      # xcodebuild looks for API keys in ./private_keys (among others).
      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p private_keys
          echo "$ASC_KEY_P8" > "private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # Build number = the workflow run number (monotonic), then
      # manageAppVersionAndBuildNumber still guarantees uniqueness against
      # anything uploaded outside CI.
      - name: Archive (Release, signed)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Giftmaxxing.xcodeproj \
            -scheme Giftmaxxing \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Giftmaxxing.xcarchive" \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | xcpretty --color

      - name: Upload to TestFlight (export + upload)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Giftmaxxing.xcarchive" \
            -exportOptionsPlist .github/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcpretty --color

      - name: Clean up signing material
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/$KEYCHAIN_NAME" ]; then
            security delete-keychain "$RUNNER_TEMP/$KEYCHAIN_NAME" || true
          fi
          rm -rf private_keys "$RUNNER_TEMP/distribution.p12"
