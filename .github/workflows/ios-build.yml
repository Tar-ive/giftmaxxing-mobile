name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'Giftmaxxing/**'
      - 'GiftmaxxingTests/**'
      - 'project.yml'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Giftmaxxing/**'
      - 'GiftmaxxingTests/**'
      - 'project.yml'
      - '.github/workflows/ios-build.yml'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # pipefail so a failing xcodebuild can't be masked by xcpretty's exit 0.
      - name: Build (app + tests, iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Giftmaxxing.xcodeproj \
            -scheme Giftmaxxing \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Unit tests (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Giftmaxxing.xcodeproj \
            -scheme Giftmaxxing \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color --test
