name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'Giftmaxxing/**'
      - 'GiftmaxxingShare/**'
      - 'GiftmaxxingTests/**'
      - '.maestro/**'
      - '.swiftlint.yml'
      - 'project.yml'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Giftmaxxing/**'
      - 'GiftmaxxingShare/**'
      - 'GiftmaxxingTests/**'
      - '.maestro/**'
      - '.swiftlint.yml'
      - 'project.yml'
      - '.github/workflows/ios-build.yml'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast static lint on Linux — SwiftLint runs fine without Xcode, so this
  # gives feedback in seconds while the macOS jobs spin up.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/realm/swiftlint:0.65.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: SwiftLint
        run: swiftlint lint --reporter github-actions-logging

  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Use the image's default (current) Xcode. Pinning an old version (e.g.
      # 16.2) breaks actool against the newer simulator runtimes the image
      # ships — the exact failure the original pinned workflow had.
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Device inventory changes with every runner image; hardcoded names like
      # "iPhone 16" stop resolving (it has no OS 26.x runtime). Pick the first
      # available iPhone on the newest installed iOS runtime, by UDID.
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted((rt for rt in data if "iOS" in rt), reverse=True)
          for rt in ios:
              phones = [d for d in data[rt] if d["isAvailable"] and d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          [ -n "$UDID" ] || { echo "::error::no available iPhone simulator found"; exit 1; }
          echo "picked $UDID"
          xcrun simctl list devices available | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # pipefail so a failing xcodebuild can't be masked by xcpretty's exit 0.
      - name: Build (app + tests, iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Giftmaxxing.xcodeproj \
            -scheme Giftmaxxing \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Unit tests (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Giftmaxxing.xcodeproj \
            -scheme Giftmaxxing \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color --test

  # Maestro UI flows (.maestro/) against a booted simulator. The DEBUG build
  # signs in headlessly as the real Cognito E2E user (see E2ESupport.swift);
  # the backend-write flow (tag e2e-write) stays out of the per-commit loop.
  e2e:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check E2E secrets are configured
        env:
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          if [ -z "$E2E_PASSWORD" ]; then
            echo "::error::Missing repository secret E2E_PASSWORD — see .maestro/README.md"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick and boot a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted((rt for rt in data if "iOS" in rt), reverse=True)
          for rt in ios:
              phones = [d for d in data[rt] if d["isAvailable"] and d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          [ -n "$UDID" ] || { echo "::error::no available iPhone simulator found"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      # NOTE: signing stays ON (simulator ad-hoc, no certs needed) — an
      # unsigned app can't touch the keychain (errSecMissingEntitlement),
      # which breaks AuthManager's session storage during E2E sign-in.
      - name: Build app (Debug, iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Giftmaxxing.xcodeproj \
            -scheme Giftmaxxing \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath dd \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            | xcpretty --color

      - name: Install app on simulator
        run: xcrun simctl install ${{ steps.sim.outputs.udid }} dd/Build/Products/Debug-iphonesimulator/Giftmaxxing.app

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Connectivity probe: proves the RUNNER can reach Cognito, so a sign-in
      # failure in the flows points at the simulator/app, not the host network.
      - name: Probe Cognito reachability
        run: |
          echo "runner → cognito-idp: HTTP $(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://cognito-idp.us-east-1.amazonaws.com/ || echo 'FAILED')"

      - name: Run Maestro flows
        env:
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          export JAVA_HOME="${JAVA_HOME_17_arm64:-$JAVA_HOME_21_arm64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          maestro test \
            --exclude-tags e2e-write \
            -e E2E_EMAIL=e2e@giftmaxxing.dev \
            -e E2E_PASSWORD="$E2E_PASSWORD" \
            .maestro/

      - name: Upload Maestro debug artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-debug
          path: ~/.maestro/tests
          retention-days: 7
