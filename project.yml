name: Giftmaxxing
options:
  bundleIdPrefix: com.giftmaxxing
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

targets:
  Giftmaxxing:
    type: application
    platform: iOS
    sources:
      - path: Giftmaxxing
    dependencies:
      - target: GiftmaxxingShare
        embed: true
    # giftmaxxing:// deep links — the share extension hands off to the app
    # after "Find similar gifts" / "Start a gift pool".
    info:
      path: Giftmaxxing/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.giftmaxxing.ios
            CFBundleURLSchemes: [giftmaxxing]
        # Only standard HTTPS (exempt) — lets TestFlight builds go straight to
        # testers without the export-compliance questionnaire on every upload.
        ITSAppUsesNonExemptEncryption: false
        # Cognito user pool app client (infra/cognito.tf outputs) — used for
        # token refresh and the E2E harness's password sign-in.
        CognitoClientId: 1i1d0pdrgcuh8vces1f4truubd
        CognitoRegion: us-east-1
        # Google Sign-In OAuth iOS client id (Google Cloud Console → APIs &
        # Services → Credentials → OAuth client ID, type iOS, bundle id
        # com.giftmaxxing.ios). EMPTY = the Google button shows its "needs a
        # one-time setup" notice — fill this and regenerate to enable it.
        # e.g. "1234567890-abc123.apps.googleusercontent.com"
        GoogleOAuthClientID: "641193240796-iu86sunkraeuf5ks755ipcf10kvutugv.apps.googleusercontent.com"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giftmaxxing.ios
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "16"
        VERSIONING_SYSTEM: apple-generic
        INFOPLIST_KEY_CFBundleDisplayName: Giftmaxxing
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        # iPhone-only (no iPad target): the layout is designed for one column,
        # and shipping the scaled-up iPad rendering invites review rejections
        # and a mandatory iPad screenshot set.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIBackgroundModes: "fetch remote-notification"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Giftmaxxing uses the microphone so you can talk to Maxi, your AI gift concierge."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Giftmaxxing transcribes your voice so Maxi can find gifts for you."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Giftmaxxing lets you choose screenshots, photos, and videos for visual search and posts you create."
        INFOPLIST_KEY_NSCameraUsageDescription: "Giftmaxxing uses the camera for visual search and photos or videos you choose to post."
        INFOPLIST_KEY_NSContactsUsageDescription: "Giftmaxxing can read birthdays from your contacts (only the ones you pick) to build your gift calendar and remind you in time."
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: KJH66PARX6
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          # Personal (free) dev team cannot provision Sign in with Apple / push.
          # Debug/device builds use stripped entitlements; Release keeps the full set.
          CODE_SIGN_ENTITLEMENTS: Giftmaxxing/Giftmaxxing-dev.entitlements
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
          CODE_SIGN_ENTITLEMENTS: Giftmaxxing/Giftmaxxing.entitlements

  # Share extension — the Instagram/Pinterest → Amazon bridge. Receives an
  # image or URL from any app's share sheet, drops it in the app-group inbox,
  # and the main app runs visual search on it at next foreground.
  GiftmaxxingShare:
    type: app-extension
    platform: iOS
    sources:
      - path: GiftmaxxingShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giftmaxxing.ios.share
        # Must match the parent app or App Store Connect rejects the delivery.
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "16"
        VERSIONING_SYSTEM: apple-generic
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Giftmaxxing
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: KJH66PARX6
        CODE_SIGN_ENTITLEMENTS: GiftmaxxingShare/GiftmaxxingShare.entitlements
        SKIP_INSTALL: true
    info:
      path: GiftmaxxingShare/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Giftmaxxing
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1

  # Unit tests for the pure-logic layer (recommendation pipeline, invite links,
  # content quality). Runs in CI via `xcodebuild test` on the simulator.
  GiftmaxxingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GiftmaxxingTests
    dependencies:
      - target: Giftmaxxing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giftmaxxing.ios.tests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"

# Explicit scheme so `xcodebuild test -scheme Giftmaxxing` knows which test
# bundle to run (auto-generated per-target schemes don't attach the tests).
schemes:
  Giftmaxxing:
    build:
      targets:
        Giftmaxxing: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - GiftmaxxingTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
